<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexoraSUB</title>

<style>

:root{

 --accent:#38bdf8;
 --accent-hover:#7dd3fc;

 --text:#e5e7eb;
 --muted:#94a3b8;

 --surface:#111e35;
 --border:rgba(148,163,184,.15);

}

*{
 box-sizing:border-box;
}

body{

 margin:0;

 min-height:100vh;

 font-family:'Segoe UI',sans-serif;

 background:#0f172a;

 background-image:
 radial-gradient(
 ellipse at 50% 0%,
 rgba(14,165,233,.09),
 transparent 55%
 );

 color:var(--text);

 display:flex;

 justify-content:center;

 align-items:center;

 padding:20px;

}

.card{

 max-width:700px;

 width:100%;

 background:var(--surface);

 border:1px solid var(--border);

 border-radius:16px;

 padding:40px;

 text-align:center;

}

h1{

 margin-top:0;

 color:var(--accent);

 font-size:3rem;

}

.warning{

 color:#fbbf24;

 font-size:1.1rem;

 font-weight:700;

 margin:25px 0;

}

.text{

 color:var(--muted);

 line-height:1.8;

 font-size:1.05rem;

}

.go-btn{

 display:inline-block;

 margin-top:30px;

 background:#0ea5e9;

 color:#082f49;

 text-decoration:none;

 padding:14px 24px;

 border-radius:10px;

 font-weight:700;

 transition:.2s ease;

}

.go-btn:hover{

 background:var(--accent-hover);

 transform:translateY(-1px);

}

footer{

 margin-top:35px;

 color:#64748b;

}

</style>

</head>

<body>

<div class="card">

<h1>NexoraSUB</h1>

<div class="text">

Hier geht es zu Nexora.

</div>

<div class="warning">

! Achtung !<br><br>

Sie verlassen share.io und werden zu mrDatenschutz umgeleitet!

</div>

<a
class="go-btn"
href="https://mrdatenschutz.github.io/Nexora/"
target="_blank"
rel="noopener noreferrer">

Zu Nexora

</a>

<footer>

© NexoraSUB

</footer>

</div>

</body>

</html>
